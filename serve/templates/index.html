<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Potato Leaf Disease Classification</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: light;

        --green: #17c964;
        --green-deep: #0e9f4c;
        --green-ink: #0a7d3b;
        --mint: #e8faf0;
        --mint-2: #d3f5e2;

        --ink: #14201a;
        --grey: #7b8a83;
        --grey-soft: #9aa8a1;
        --line: #e6ece9;

        --early: #f5a524;
        --late: #ef4444;
        --healthy: #17c964;

        --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --hand: "Caveat", "Segoe Script", cursive;
        --ease: cubic-bezier(0.22, 0.7, 0.24, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      /* Soft mint glow, like the poster's circle behind the phone. */
      body::before {
        content: "";
        position: fixed;
        top: -220px;
        right: -180px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--mint) 0%,
          rgba(232, 250, 240, 0) 68%
        );
        pointer-events: none;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: 0 auto;
        padding: 64px 22px 90px;
      }

      /* ── Entrance ───────────────────────────────────────────────── */
      .rise {
        opacity: 0;
        transform: translateY(16px);
        animation: rise 0.7s var(--ease) forwards;
      }
      .d1 {
        animation-delay: 0.12s;
      }
      .d2 {
        animation-delay: 0.24s;
      }

      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rise {
          animation: none;
          opacity: 1;
          transform: none;
        }
        * {
          transition-duration: 0.01ms !important;
        }
      }

      /* ── Header ─────────────────────────────────────────────────── */
      header {
        margin-bottom: 34px;
      }

      h1 {
        font-size: clamp(1.42rem, 5.1vw, 2.05rem);
        font-weight: 800;
        letter-spacing: -0.038em;
        line-height: 1.12;
        margin: 0;
      }

      /* One line once there is room for it. */
      @media (min-width: 530px) {
        h1 {
          white-space: nowrap;
        }
      }

      h1 span {
        color: var(--green-ink);
      }

      .underline {
        display: block;
        width: min(440px, 96%);
        margin: 4px 0 0 -4px;
        overflow: visible;
      }

      .underline path {
        stroke: var(--green);
        stroke-width: 7;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: draw 1s var(--ease) 0.35s forwards;
      }

      .underline circle {
        fill: var(--green);
        opacity: 0;
        animation: pop 0.3s var(--ease) 1.2s forwards;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pop {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .underline path {
          stroke-dashoffset: 0;
          animation: none;
        }
        .underline circle {
          opacity: 1;
          animation: none;
        }
      }

      .hand {
        font-family: var(--hand);
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--grey);
        margin: 14px 0 0;
        line-height: 1.25;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        list-style: none;
        padding: 0;
        margin: 22px 0 0;
      }

      .chips li {
        display: flex;
        align-items: center;
        gap: 7px;
        background: #f6f9f7;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px 6px 11px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--grey);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.early {
        background: var(--early);
      }
      .dot.late {
        background: var(--late);
      }
      .dot.healthy {
        background: var(--healthy);
      }

      /* ── Cards ──────────────────────────────────────────────────── */
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 18px 40px -30px rgba(20, 32, 26, 0.55);
      }

      .card + .card {
        margin-top: 18px;
      }

      /* ── Drop zone ──────────────────────────────────────────────── */
      .drop {
        display: block;
        border: 2px dashed #cfe6da;
        border-radius: 18px;
        background: #fafdfb;
        padding: 44px 20px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.22s,
          background 0.22s,
          transform 0.22s;
      }

      .drop:hover,
      .drop:focus-within {
        border-color: var(--green);
        background: var(--mint);
      }

      .drop.dragging {
        border-color: var(--green);
        background: var(--mint-2);
        transform: scale(1.01);
      }

      .drop.has-file {
        padding: 10px;
        border-style: solid;
        border-color: var(--line);
        background: #fff;
      }

      .drop input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .drop-icon {
        color: var(--green);
        margin-bottom: 10px;
      }

      .drop-title {
        font-size: 1.02rem;
        font-weight: 700;
        margin: 0 0 3px;
      }

      .drop-hint {
        font-family: var(--hand);
        font-size: 1.14rem;
        color: var(--grey-soft);
        margin: 0;
      }

      figure {
        margin: 0;
        display: none;
      }
      .drop.has-file figure {
        display: block;
      }
      .drop.has-file .drop-prompt {
        display: none;
      }

      figure img {
        display: block;
        width: 100%;
        max-height: 330px;
        object-fit: contain;
        background: #f2f6f4;
        border-radius: 12px;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.76rem;
        font-weight: 500;
        color: var(--grey-soft);
        padding: 9px 6px 3px;
      }

      figcaption span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Buttons ────────────────────────────────────────────────── */
      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 16px;
      }

      button {
        font-family: var(--sans);
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: var(--green);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 15px 28px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s,
          background 0.18s;
        box-shadow: 0 10px 22px -12px rgba(23, 201, 100, 0.95);
      }

      button svg {
        transition: transform 0.22s var(--ease);
      }

      button:hover:not(:disabled) {
        background: var(--green-deep);
        transform: translateY(-2px);
        box-shadow: 0 16px 28px -14px rgba(14, 159, 76, 0.95);
      }

      button:hover:not(:disabled) svg {
        transform: translateX(4px);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      button:disabled {
        background: #c3d6cd;
        box-shadow: none;
        cursor: default;
      }

      button:focus-visible,
      .drop:focus-within {
        outline: 3px solid rgba(23, 201, 100, 0.4);
        outline-offset: 3px;
      }

      .clear {
        background: none;
        color: var(--grey-soft);
        font-size: 0.86rem;
        font-weight: 600;
        padding: 12px 16px;
        box-shadow: none;
      }
      .clear:hover {
        background: #f4f7f5;
        color: var(--ink);
        transform: none;
        box-shadow: none;
      }

      /* ── Result ─────────────────────────────────────────────────── */
      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }

      .verdict {
        font-size: clamp(1.6rem, 5.6vw, 2.15rem);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.08;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .verdict .dot {
        width: 13px;
        height: 13px;
      }
      .verdict.early {
        color: #b57509;
      }
      .verdict.late {
        color: #cf3030;
      }
      .verdict.healthy {
        color: var(--green-ink);
      }

      .score {
        text-align: right;
        flex-shrink: 0;
      }

      .score b {
        display: block;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .score small {
        font-family: var(--hand);
        font-size: 1.06rem;
        color: var(--grey-soft);
      }

      .breakdown {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 11px;
      }

      .bar {
        display: grid;
        grid-template-columns: 92px 1fr 52px;
        gap: 12px;
        align-items: center;
      }

      .bar-name {
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--grey);
      }

      .track {
        display: block;
        position: relative;
        background: #f0f4f2;
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
      }

      .fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--grey-soft);
        transition: width 0.8s var(--ease);
      }
      .fill.early {
        background: var(--early);
      }
      .fill.late {
        background: var(--late);
      }
      .fill.healthy {
        background: var(--healthy);
      }

      .thresh {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(20, 32, 26, 0.28);
        border-radius: 2px;
      }

      .bar-val {
        font-size: 0.82rem;
        font-weight: 700;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--grey);
      }

      .key {
        font-family: var(--hand);
        font-size: 1.08rem;
        color: var(--grey-soft);
        margin: 2px 0 0;
        grid-column: 1 / -1;
      }

      /* Inconclusive */
      .unsure {
        background: #fffaf0;
        border: 1px solid #fae7bd;
        border-radius: 16px;
        padding: 16px 18px;
      }

      .unsure b {
        display: block;
        font-size: 1.12rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #a76a05;
        margin-bottom: 3px;
      }

      .unsure p {
        margin: 0;
        font-size: 0.9rem;
        color: #8a6a2f;
      }

      .err {
        font-size: 0.92rem;
        font-weight: 600;
        color: #cf3030;
        margin: 0;
      }

      .working {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--hand);
        font-size: 1.25rem;
        color: var(--grey);
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid var(--mint-2);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 430px) {
        main {
          padding: 44px 16px 70px;
        }
        .bar {
          grid-template-columns: 76px 1fr 46px;
          gap: 9px;
        }
        .score {
          text-align: left;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header class="rise">
        <h1>Potato Leaf <span>Disease Classification</span></h1>

        <!-- <svg class="underline" viewBox="0 0 440 16" aria-hidden="true">
          <path d="M5 11C78 4 240 2.5 402 8" />
          <circle cx="427" cy="10" r="5" />
        </svg> -->

        <p class="hand">Snap a leaf, get an answer in a second.</p>

        <ul class="chips">
          <li><span class="dot early"></span>Early Blight</li>
          <li><span class="dot late"></span>Late Blight</li>
          <li><span class="dot healthy"></span>Healthy</li>
        </ul>
      </header>

      <section class="card rise d1">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" capture="environment" />

          <div class="drop-prompt">
            <svg
              class="drop-icon"
              width="38"
              height="38"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.5 3.5C10 4 5 8 5 13.5c0 3.6 2.6 6.2 6 6.2 5.5 0 9.5-5.7 9.5-16.2Z"
              />
              <path d="M20.5 3.5 8.2 18.6" />
              <path d="M16.9 8.9 13 8.2" />
              <path d="M14.2 12.4 10.3 11.7" />
            </svg>
            <p class="drop-title">Drop a leaf photo here</p>
            <p class="drop-hint">or tap to browse — you can paste one too</p>
          </div>

          <figure>
            <img id="preview" alt="Selected leaf photo" />
            <figcaption>
              <span id="fname"></span><span id="fsize"></span>
            </figcaption>
          </figure>
        </label>

        <div class="actions">
          <button id="go" type="button">
            Classify
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </button>
          <button class="clear" id="clear" type="button" hidden>Clear</button>
        </div>
      </section>

      <div id="out" aria-live="polite"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const fileEl = $("file"),
        dropEl = $("drop"),
        goEl = $("go"),
        clearEl = $("clear"),
        outEl = $("out"),
        prevEl = $("preview"),
        fnameEl = $("fname"),
        fsizeEl = $("fsize");

      const MAX_BYTES = 10 * 1024 * 1024;
      let THRESHOLD = 0.9;
      let objectUrl = null;

      const KEY = {
        "Early Blight": "early",
        "Late Blight": "late",
        Healthy: "healthy",
      };
      const cls = (l) => KEY[l] || "";
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const kb = (n) =>
        n < 1048576
          ? (n / 1024).toFixed(0) + " KB"
          : (n / 1048576).toFixed(1) + " MB";

      /* Threshold comes from the server so the marker never lies. */
      fetch("/health")
        .then((r) => r.json())
        .then((h) => {
          if (typeof h.threshold === "number") THRESHOLD = h.threshold;
        })
        .catch(() => {});

      /* ── File handling ──────────────────────────────────────────── */
      function showFile(f) {
        if (!f) return reset();
        if (!f.type.startsWith("image/"))
          return renderError("That file isn't an image.");
        if (f.size > MAX_BYTES)
          return renderError(
            "That photo is " + kb(f.size) + " — the limit is 10 MB.",
          );

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(f);
        prevEl.src = objectUrl;
        fnameEl.textContent = f.name || "pasted image";
        fsizeEl.textContent = kb(f.size);
        dropEl.classList.add("has-file");
        clearEl.hidden = false;
        outEl.innerHTML = "";
      }

      function reset() {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = null;
        fileEl.value = "";
        prevEl.removeAttribute("src");
        dropEl.classList.remove("has-file");
        clearEl.hidden = true;
        outEl.innerHTML = "";
      }

      function adopt(f) {
        const dt = new DataTransfer();
        dt.items.add(f);
        fileEl.files = dt.files;
        showFile(f);
      }

      fileEl.onchange = () => showFile(fileEl.files[0]);
      clearEl.onclick = (e) => {
        e.preventDefault();
        reset();
      };

      ["dragenter", "dragover"].forEach((ev) =>
        dropEl.addEventListener(ev, (e) => {
          e.preventDefault();
          dropEl.classList.add("dragging");
        }),
      );
      ["dragleave", "drop"].forEach((ev) =>
        dropEl.addEventListener(ev, (e) => {
          e.preventDefault();
          dropEl.classList.remove("dragging");
        }),
      );
      dropEl.addEventListener("drop", (e) => {
        const f = e.dataTransfer.files[0];
        if (f) adopt(f);
      });

      window.addEventListener("paste", (e) => {
        const it = [...(e.clipboardData?.items || [])].find((i) =>
          i.type.startsWith("image/"),
        );
        if (it) adopt(it.getAsFile());
      });

      /* ── Rendering ──────────────────────────────────────────────── */
      const card = (inner) =>
        (outEl.innerHTML = '<section class="card">' + inner + "</section>");

      function renderError(msg) {
        card('<p class="err">' + esc(msg) + "</p>");
      }

      function bars(probs) {
        const rows = Object.entries(probs)
          .sort((a, b) => b[1] - a[1])
          .map(
            ([k, v]) =>
              '<div class="bar"><span class="bar-name">' +
              esc(k) +
              '</span><span class="track"><span class="fill ' +
              cls(k) +
              '" data-w="' +
              (v * 100).toFixed(1) +
              '"></span><span class="thresh" style="left:' +
              (THRESHOLD * 100).toFixed(1) +
              '%"></span></span><span class="bar-val">' +
              (v > 0 && v < 0.005 ? "&lt;1" : (v * 100).toFixed(0)) +
              "%</span></div>",
          )
          .join("");
        return (
          '<div class="breakdown">' +
          rows +
          '<p class="key">the line marks ' +
          (THRESHOLD * 100).toFixed(0) +
          "% — below it, no call is made</p></div>"
        );
      }

      function animateBars() {
        requestAnimationFrame(() =>
          document
            .querySelectorAll(".fill[data-w]")
            .forEach((el) => (el.style.width = el.dataset.w + "%")),
        );
      }

      function renderResult(d) {
        const c = cls(d.label);
        const body = d.abstain
          ? '<div class="unsure"><b>Not sure about this one</b><p>Closest is ' +
            esc(d.label) +
            " at " +
            (d.confidence * 100).toFixed(0) +
            "%, under the " +
            (THRESHOLD * 100).toFixed(0) +
            "% mark. Try again with the leaf centred and better lit.</p></div>" +
            bars(d.probs)
          : '<div class="result-head">' +
            '<h2 class="verdict ' +
            c +
            '"><span class="dot ' +
            c +
            '"></span>' +
            esc(d.label) +
            "</h2>" +
            '<div class="score"><b>' +
            (d.confidence * 100).toFixed(0) +
            "%</b><small>sure</small></div></div>" +
            bars(d.probs);

        card(body);
        animateBars();
      }

      /* ── Submit ─────────────────────────────────────────────────── */
      goEl.onclick = async () => {
        const f = fileEl.files[0];
        if (!f) return renderError("Pick a leaf photo first.");

        goEl.disabled = true;
        card(
          '<div class="working"><span class="spinner"></span>Having a look…</div>',
        );

        const fd = new FormData();
        fd.append("image", f);

        try {
          const r = await fetch("/predict", { method: "POST", body: fd });
          if (r.status === 413) {
            renderError("Too large — the server accepts up to 10 MB.");
          } else if (!r.ok && r.status >= 500) {
            renderError("Server error " + r.status + ". Check the terminal.");
          } else {
            const d = await r.json();
            if (d.error) renderError(d.error);
            else renderResult(d);
          }
        } catch (e) {
          renderError("Couldn't reach the server — is it still running?");
        } finally {
          goEl.disabled = false;
        }
      };
    </script>
  </body>
</html>
